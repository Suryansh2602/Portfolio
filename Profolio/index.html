<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Suryansh Pushpkar | Backend &amp; Full-Stack Developer</title>
    <meta
      name="description"
      content="Suryansh Pushpkar is a backend and full-stack developer building scalable systems with Java, Spring Boot, microservices, and React."
    />
    <link rel="canonical" href="https://suryansh-iota.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://suryansh-iota.vercel.app/" />
    <meta property="og:image" content="https://suryansh-iota.vercel.app/logo.png" />
    <meta property="og:title" content="Suryansh Pushpkar | Backend &amp; Full-Stack Developer" />
    <meta
      property="og:description"
      content="Backend-heavy products, full-stack applications, and scalable systems built with Java, Spring Boot, and React."
    />
    <meta name="theme-color" content="#0b0b0a" />

    <!-- Apply the saved theme before first paint so there is no light/dark flash -->
    <script>
      try {
        var savedTheme = localStorage.getItem('portfolio-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
